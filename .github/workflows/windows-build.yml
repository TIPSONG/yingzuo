name: Windows build

# B03：在 Windows runner 上实际构建便携包与 NSIS 安装包（未签名），并上传产物与校验清单。
on:
  workflow_dispatch:
  pull_request:
    paths: ['package.json', 'package-lock.json', 'desktop/**', 'shared/**', 'tools/build-win.cjs', '.github/workflows/windows-build.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke-check packaged native modules
        shell: pwsh
        run: |
          $unpacked = Get-ChildItem dist -Directory | Where-Object Name -like 'win-unpacked*' | Select-Object -First 1
          if (-not $unpacked) { throw 'win-unpacked 不存在' }
          Get-ChildItem "$($unpacked.FullName)\resources\app.asar.unpacked\node_modules\better-sqlite3\build\Release\*.node"
      - uses: actions/upload-artifact@v4
        with:
          name: yingzuo-windows
          path: |
            dist/*.exe
            dist/artifacts.json
            dist/SHA256SUMS.txt
          retention-days: 14
