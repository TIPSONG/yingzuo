name: Regression

on:
  pull_request:
  push:
    branches: [main, feat/p0-desktop-integration, feat/grovebot-impl]

permissions:
  contents: read

jobs:
  regression:
    name: Unit and mocked integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # 安装依赖以便测试 better-sqlite3 / sharp（Node ABI）。Electron 二进制不需要。
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run check
      - run: python -m unittest discover -s tests -p test_p0_baseline.py -v
  browser-regression:
    name: Required browser regressions (Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - run: npm ci --ignore-scripts
      - run: npm run test:browser
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          REQUIRE_BROWSER_TESTS: '1'
